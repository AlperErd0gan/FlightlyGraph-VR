name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests that need the licensed EUROCONTROL data skip themselves when it is absent.
      - run: pytest tests/

  licensed-data-guard:
    name: No licensed EUROCONTROL data in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if licensed files are tracked
        run: |
          bad=$(git ls-files | grep -i -E 'Flights_.*\.csv|_ectrl.*\.(json|zip)$|data/processed/eurocontrol/|data/raw/eurocontrol/|gemini_key' || true)
          if [ -n "$bad" ]; then
            echo "Licensed or secret files are tracked:"
            echo "$bad"
            exit 1
          fi
